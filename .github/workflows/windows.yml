# Windows 판(베타)을 실제 Windows 에서 돌려 본다. 맥에는 Windows 가 없어서, 여기가 Windows 증거의 유일한 자리다.
#
# - 훅 테스트: Windows 용 훅 한 줄을 cmd · PowerShell · Git Bash 셋으로 실제로 돌려 sessions.json 에 적히는지 본다
# - 앱 테스트: 상태 판정(core.js)과 연동 확인(setup-check.js)
# - 설치본: zip 을 만들고, 그 안의 Retto.exe 를 가짜 홈으로 띄워 화면을 PNG 로 남긴다
#
# 이것은 [테스트] 단계 증거다. 사람이 쓰는 PC 에서 Claude Code 와 함께 확인한 것([실기])과는 다르다.
name: windows

on:
  workflow_dispatch:
  push:
    paths: ['hook/**', 'windows/**', 'assets/**', '.github/workflows/windows.yml']

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 훅 테스트 (cmd · PowerShell · Git Bash)
        working-directory: hook
        run: npm test

      - name: 앱 의존성
        working-directory: windows
        run: npm ci

      - name: 앱 테스트
        working-directory: windows
        run: npm test

      - name: 설치본 만들기 (x64 zip)
        working-directory: windows
        run: npx electron-builder --win zip --x64 --publish never

      - name: 설치본을 가짜 홈으로 띄워 화면 남기기
        shell: pwsh
        run: |
          $home2 = Join-Path $env:RUNNER_TEMP 'retto-home'
          New-Item -ItemType Directory -Force -Path (Join-Path $home2 '.claude\retto-pet') | Out-Null
          $now = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $json = '{"version":1,"sessions":{"s1":{"sessionId":"s1","state":"waiting","updatedAt":"' + $now + '","attention":true,"cwd":"C:\\work\\landing","sessionTitle":"랜딩 히어로 고치기","client":"vscode"}}}'
          [IO.File]::WriteAllText((Join-Path $home2 '.claude\retto-pet\sessions.json'), $json, (New-Object Text.UTF8Encoding $false))
          $exe = (Get-ChildItem dist\windows\win-unpacked\Retto.exe | Select-Object -First 1).FullName
          Write-Host "session: $([Diagnostics.Process]::GetCurrentProcess().SessionId) user: $env:USERNAME appdata: $env:APPDATA"

          # 원인을 좁히려고 조건을 바꿔 여러 번 띄운다. 하나라도 그림이 나오면 그 조건이 답이다.
          function Try-Preview($name, $extraArgs, $fakeHome) {
            $out = Join-Path $env:RUNNER_TEMP "preview-$name.png"
            $saved = $env:USERPROFILE
            if ($fakeHome) { $env:USERPROFILE = $home2 }
            $env:ELECTRON_ENABLE_LOGGING = '1'
            $args2 = @('--render-preview', "`"$out`"") + $extraArgs
            $p = Start-Process -FilePath $exe -ArgumentList $args2 -PassThru -Wait `
              -RedirectStandardOutput "$out.stdout" -RedirectStandardError "$out.stderr"
            $env:USERPROFILE = $saved
            Write-Host "===== $name · exit $('0x{0:X8}' -f $p.ExitCode) · png $(Test-Path $out)"
            if (Test-Path "$out.log") { Get-Content "$out.log" | Write-Host }
            Get-Content "$out.stderr" -ErrorAction SilentlyContinue | Select-Object -Last 25 | Write-Host
            return (Test-Path $out)
          }
          $a = Try-Preview 'fakehome' @() $true
          $b = Try-Preview 'realhome' @() $false
          $c = Try-Preview 'nosandbox' @('--no-sandbox') $true
          $d = Try-Preview 'verbose' @('--enable-logging=stderr', '--v=1') $true
          if ($a) { Copy-Item (Join-Path $env:RUNNER_TEMP 'preview-fakehome.png') (Join-Path $env:RUNNER_TEMP 'retto-windows-preview.png') }
          if (-not $a) { throw '가짜 홈으로 화면을 남기지 못했다 — 위 조건별 결과를 본다' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retto-windows
          path: |
            ${{ runner.temp }}/retto-windows-preview.png
            ${{ runner.temp }}/preview-*
            dist/windows/*.zip
          retention-days: 14
