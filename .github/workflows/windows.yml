# Windows 판(베타)을 실제 Windows 에서 돌려 본다. 맥에는 Windows 가 없어서, 여기가 Windows 증거의 유일한 자리다.
#
# - 훅 테스트: Windows 용 훅 한 줄을 cmd · PowerShell · Git Bash 셋으로 실제로 돌려 sessions.json 에 적히는지 본다
# - 앱 테스트: 상태 판정(core.js)과 연동 확인(setup-check.js)
# - 설치본: zip 을 만들고, 그 안의 Retto.exe 를 가짜 홈으로 띄워 화면을 PNG 로 남긴다
#
# 이것은 [테스트] 단계 증거다. 사람이 쓰는 PC 에서 Claude Code 와 함께 확인한 것([실기])과는 다르다.
name: windows

on:
  workflow_dispatch:
  push:
    paths: ['hook/**', 'windows/**', 'assets/**', '.github/workflows/windows.yml']

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 훅 테스트 (cmd · PowerShell · Git Bash)
        working-directory: hook
        run: npm test

      - name: 앱 의존성
        working-directory: windows
        run: npm ci

      - name: 앱 테스트
        working-directory: windows
        run: npm test

      - name: 설치본 만들기 (x64 zip)
        working-directory: windows
        run: npx electron-builder --win zip --x64 --publish never

      - name: 설치본을 가짜 홈으로 띄워 화면 남기기
        shell: pwsh
        run: |
          $home2 = Join-Path $env:RUNNER_TEMP 'retto-home'
          New-Item -ItemType Directory -Force -Path (Join-Path $home2 '.claude\retto-pet') | Out-Null
          $now = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $json = '{"version":1,"sessions":{"s1":{"sessionId":"s1","state":"waiting","updatedAt":"' + $now + '","attention":true,"cwd":"C:\\work\\landing","sessionTitle":"랜딩 히어로 고치기","client":"vscode"}}}'
          [IO.File]::WriteAllText((Join-Path $home2 '.claude\retto-pet\sessions.json'), $json, (New-Object Text.UTF8Encoding $false))
          $exe = (Get-ChildItem dist\windows\win-unpacked\Retto.exe | Select-Object -First 1).FullName
          Write-Host "session: $([Diagnostics.Process]::GetCurrentProcess().SessionId) user: $env:USERNAME appdata: $env:APPDATA"

          # 레토가 읽는 홈만 RETTO_HOME 으로 바꾼다. USERPROFILE 을 바꾸면 Electron 이 시작하자마자
          # 0x80000003 으로 끝난다(2026-11-03 조건별 실행: 가짜 USERPROFILE 3번 모두 실패, 진짜 홈 통과).
          $env:RETTO_HOME = $home2
          $out = Join-Path $env:RUNNER_TEMP 'retto-windows-preview.png'
          $p = Start-Process -FilePath $exe -ArgumentList '--render-preview', "`"$out`"" -PassThru -Wait `
            -RedirectStandardOutput "$out.stdout" -RedirectStandardError "$out.stderr"
          Write-Host "exit $('0x{0:X8}' -f $p.ExitCode) · png $(Test-Path $out)"
          if (Test-Path "$out.log") { Get-Content "$out.log" | Write-Host }
          if (-not (Test-Path $out)) { Get-Content "$out.stderr" -ErrorAction SilentlyContinue | Select-Object -Last 25 | Write-Host; throw '화면을 남기지 못했다' }
          # 가짜 sessions.json 의 입력 대기 세션을 실제로 읽고 골랐는지까지 본다.
          if (-not (Select-String -Path "$out.log" -Pattern 'pose=waiting' -Quiet)) { throw '입력 대기 세션을 고르지 못했다' }

      - name: 처음부터 끝까지 — 훅 설치 → 셸 셋으로 훅 실행 → 화면 → 훅 제거
        shell: pwsh
        run: node windows/test-e2e/flow.mjs (Resolve-Path dist\windows\win-unpacked\Retto.exe) (Join-Path $env:RUNNER_TEMP 'e2e')

      # Windows PC 가 없어서, Windows 에서만 다르게 도는 부분을 여기서 돌린다(windows/src/self-check.js) —
      # 토큰 암호화(DPAPI) · ping 되는 소켓 · node:sqlite · Windows 경로의 Codex 기록 · Orca 찾기 · 스킨 파일.
      - name: 자체 점검 (Orca 없이)
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist\windows\win-unpacked\Retto.exe).Path
          $out = Join-Path $env:RUNNER_TEMP 'self-check.json'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-check', "`"$out`"" -PassThru -Wait
          Get-Content $out | Write-Host
          if ($p.ExitCode -ne 0) { throw "자체 점검 실패 ($($p.ExitCode))" }

      # Windows 의 Orca 가 실제로 어디 깔리고, 레토가 그 런타임에 붙는지 본다. 맥에서는 확인할 수 없던 자리다.
      # Orca 설치가 러너 사정으로 안 되면 결과만 남기고 다른 확인은 계속한다.
      - name: Orca 설치 → 띄우기 → 자체 점검
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'orca'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download -R stablyai/orca --pattern 'orca-windows-setup.exe' --dir $dir
          $setup = Join-Path $dir 'orca-windows-setup.exe'
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Orca\Orca.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\orca\Orca.exe'),
            (Join-Path $env:ProgramFiles 'Orca\Orca.exe')
          )
          $orca = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $orca) {
            $orca = Get-ChildItem -Path $env:LOCALAPPDATA, $env:ProgramFiles -Filter 'Orca.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          Write-Host "Orca 설치 위치: $orca"
          $orca | Out-File (Join-Path $env:RUNNER_TEMP 'orca-path.txt')
          if (-not $orca) { throw 'Orca.exe 를 찾지 못했다' }
          Start-Process -FilePath $orca
          $exe = (Resolve-Path dist\windows\win-unpacked\Retto.exe).Path
          $out = Join-Path $env:RUNNER_TEMP 'self-check-orca.json'
          for ($i = 0; $i -lt 12; $i++) {
            Start-Sleep -Seconds 10
            $p = Start-Process -FilePath $exe -ArgumentList '--self-check', "`"$out`"", '--require-orca' -PassThru -Wait
            if ($p.ExitCode -eq 0) { break }
          }
          Get-Content $out | Write-Host
          if ($p.ExitCode -ne 0) { throw 'Orca 에 붙지 못했다' }

      # 스킨 프레임은 맥 앱이 그린 생성물이라 저장소에 없다. 가장 최근 Windows 릴리스 zip 의 스킨을 이 빌드에 넣어
      # 14종을 실제 Windows 에서 하나씩 그려 본다(화면은 산출물로 남는다).
      - name: 스킨 14종을 Windows 에서 그려 보기
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release list -R $env:GITHUB_REPOSITORY --limit 30 --json tagName --jq '[.[] | select(.tagName | endswith("-windows")) | .tagName][0]'
          Write-Host "스킨 출처: $tag"
          $dir = Join-Path $env:RUNNER_TEMP 'skins-release'
          gh release download $tag -R $env:GITHUB_REPOSITORY --pattern '*-windows-x64.zip' --dir $dir
          $zip = Get-ChildItem $dir -Filter '*.zip' | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath (Join-Path $dir 'x') -Force
          $skins = Join-Path $dir 'x\resources\skins'
          if (-not (Test-Path (Join-Path $skins 'manifest.json'))) { Write-Host '이 릴리스에는 스킨이 없다'; exit 0 }
          Copy-Item -Recurse -Force $skins dist\windows\win-unpacked\resources\skins
          $exe = (Resolve-Path dist\windows\win-unpacked\Retto.exe).Path
          $check = Join-Path $env:RUNNER_TEMP 'self-check-skins.json'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-check', "`"$check`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content $check | Write-Host; throw '스킨 파일 점검 실패' }
          $home2 = Join-Path $env:RUNNER_TEMP 'retto-home-skins'
          New-Item -ItemType Directory -Force -Path (Join-Path $home2 '.claude\retto-pet') | Out-Null
          $now = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $json = '{"version":1,"sessions":{"s1":{"sessionId":"s1","state":"running","updatedAt":"' + $now + '","cwd":"C:\\work\\landing","sessionTitle":"스킨 확인","client":"vscode"}}}'
          [IO.File]::WriteAllText((Join-Path $home2 '.claude\retto-pet\sessions.json'), $json, (New-Object Text.UTF8Encoding $false))
          $env:RETTO_HOME = $home2
          $shots = Join-Path $env:RUNNER_TEMP 'skins'
          New-Item -ItemType Directory -Force -Path $shots | Out-Null
          $ids = (Get-Content (Join-Path $skins 'manifest.json') -Raw | ConvertFrom-Json).skins.id
          $failed = @()
          foreach ($id in $ids) {
            $env:RETTO_PREVIEW_SKIN = $id
            $out = Join-Path $shots "$id.png"
            $p = Start-Process -FilePath $exe -ArgumentList '--render-preview', "`"$out`"" -PassThru -Wait
            if (-not (Test-Path $out)) { $failed += $id }
            Write-Host "$id · exit $($p.ExitCode) · png $(Test-Path $out)"
          }
          if ($failed.Count) { throw "그리지 못한 스킨: $($failed -join ', ')" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retto-windows
          path: |
            ${{ runner.temp }}/retto-windows-preview.png
            ${{ runner.temp }}/retto-windows-preview.png.*
            ${{ runner.temp }}/e2e/
            ${{ runner.temp }}/self-check*.json
            ${{ runner.temp }}/orca-path.txt
            ${{ runner.temp }}/skins/
            dist/windows/*.zip
          retention-days: 14
