<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; font-src file:; style-src 'unsafe-inline'; script-src 'self'">
<title>Retto</title>
<style>
  /* 맥 앱 오버레이와 같은 구성 — 위에 말풍선, 아래에 레토, 레토 어깨에 배지. 배경은 비운다.
     레토 칸의 크기·자리는 스킨 프레임에 맞춰 pet.js 가 정한다(--pet-*). */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font-family: 'Retto Hand', 'Malgun Gothic', sans-serif; --pet-w: 112px; --pet-h: 120px; --pet-top: 0px; --pet-right: 0px; }
  #bubble {
    position: absolute; left: 12px; right: 12px; bottom: calc(var(--pet-h) - var(--pet-top) + 4px);
    background: #FFFDF6; color: #3B2F25; border-radius: 18px; padding: 8px 12px 9px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .18); font-size: 17px; line-height: 1.25;
  }
  #bubble::after {
    content: ''; position: absolute; bottom: -9px; left: 50%; margin-left: -9px;
    border: 9px solid transparent; border-bottom: 0; border-top-color: #FFFDF6;
  }
  #tag { display: inline-block; font: 600 11px/1 'Malgun Gothic', sans-serif; letter-spacing: .04em; padding: 3px 7px; border-radius: 999px; margin-bottom: 4px; }
  #title { font-size: 15px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #message { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #pet { position: absolute; left: 50%; bottom: 0; width: var(--pet-w); height: var(--pet-h); transform: translateX(-50%); cursor: pointer; }
  #badge {
    position: absolute; left: 50%; bottom: calc(var(--pet-h) - var(--pet-top) - 24px); margin-left: calc(var(--pet-right) - 18px); min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box;
    border-radius: 11px; background: #F06200; color: #441C00; font: 700 13px/22px 'Malgun Gothic', sans-serif; text-align: center;
    display: none;
  }
</style>
</head>
<body>
  <div id="bubble"><span id="tag"></span><div id="title"></div><div id="message"></div></div>
  <canvas id="pet" width="224" height="240"></canvas>
  <div id="badge"></div>
  <script src="pet.js"></script>
</body>
</html>
