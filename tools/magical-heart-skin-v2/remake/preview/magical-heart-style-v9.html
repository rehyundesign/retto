<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매지컬 하트 · 펜던트 이펙트 정지 시안</title><style>body{margin:0;background:#f3eeef;color:#49353e;font:15px/1.7 system-ui,sans-serif}main{max-width:860px;margin:32px auto;padding:24px}h1{font-size:25px;margin:0}p{color:#795965}.views{display:flex;flex-wrap:wrap;gap:24px;margin-top:24px}figure{margin:0}img{display:block;width:224px;height:320px;border-radius:12px}figcaption{margin-top:8px}button{padding:8px 16px;border:1px solid #d7bdc8;border-radius:8px;background:white;color:inherit;cursor:pointer}body.large img{width:448px;height:640px}</style><main><h1>매지컬 하트 · 펜던트 발광</h1><p>스타일 확인용 정지 시안 한 장입니다. 펜던트의 작은 섬광과 몸 바깥쪽의 짧은 실크·크리스털 하트로 정리했습니다. 얼굴·앞발·의상은 가리지 않도록 배치했습니다.<br>레토 원본은 유지했으며, 기존 모션 미리보기에는 적용하지 않았습니다.</p><button id="size">2× 확대</button><div class="views"><figure><img src="style-review-v9/dark.png" alt="어두운 배경에서 본 펜던트 발광 정지 시안"><figcaption>어두운 배경</figcaption></figure><figure><img src="style-review-v9/white.png" alt="흰 배경에서 본 동일한 정지 시안"><figcaption>흰 배경</figcaption></figure></div></main><script>document.getElementById('size').onclick=function(){const big=document.body.classList.toggle('large');this.textContent=big?'1× 크기':'2× 확대';};</script></html>
