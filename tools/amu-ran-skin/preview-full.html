<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아무 · 란 — 전체 동작</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffdfa;color:#51444d;font:14px system-ui,-apple-system,sans-serif}body.dark{background:#23232d;color:#f0e7ee}header{position:sticky;top:0;background:inherit;z-index:2;border-bottom:1px solid #bfa3b54d;padding:18px 24px}h1{font-size:21px;margin:0 0 12px}button,select,input{font:inherit}button,select{padding:8px 12px;border:1px solid #bfa3b5;border-radius:8px;background:transparent;color:inherit;margin:0 5px 5px 0}button[aria-pressed=true]{background:#e86b9f;color:white}main{padding:16px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(224px,1fr));gap:14px}article{border:1px solid #bfa3b53d;border-radius:12px;padding:12px;text-align:center}h2{font-size:14px;margin:0}canvas{width:224px;height:320px;display:block;margin:auto}small{opacity:.7}.gaze{margin-top:24px;display:flex;flex-wrap:wrap;gap:20px;align-items:center}.status{margin-top:7px;font-variant-numeric:tabular-nums}.load{padding:8px 0;color:#bb5684}a{color:inherit}.state-label{display:inline-flex;padding:5px 10px;margin:0 0 9px;border-radius:20px;background:#ffe5ef;color:#a82e60;font-size:13px;font-weight:700}.dark .state-label{background:#592b42;color:#ffc8de}.state-note{font-size:12px;line-height:1.5;opacity:.75;margin:7px 0 0;min-height:32px}.intro{margin:0 0 12px;opacity:.75;font-size:13px}
</style>
<header><h1>아무 · 란</h1><p class="intro">카드 위 상태 이름과 함께 동작을 확인할 수 있어요.</p><button id="pause">일시정지</button><select id="speed" aria-label="재생 속도"><option value="1">기준 속도</option><option value="0.5">느리게 0.5×</option><option value="1.5">빠르게 1.5×</option></select><button id="theme">어두운 배경</button><button id="effects" aria-pressed="true">이펙트 표시</button><button id="hold" aria-pressed="false">캐릭터 고정</button><button id="reset">처음부터</button><div class="status" id="clock">불러오는 중</div></header>
<main><div class="load" id="load">독립 동작 컷을 불러오고 있어요.</div><section class="grid" id="grid"></section><section class="gaze"><div><h2>시선 따라보기 · 교복 / 변신</h2><p>슬라이더로 16방향을 확인할 수 있어요.</p><input id="direction" aria-label="시선 방향" type="range" min="0" max="15" step="1" value="0"><p id="directionName">방향 0 / 15</p><small>고개가 멈춰도 란과 효과는 계속 움직여요.</small></div><article><div class="state-label">기본 대기 · 시선 반응</div><h2>교복</h2><canvas id="school" width="448" height="640"></canvas></article><article><div class="state-label">완료 · 시선 반응</div><h2>변신</h2><canvas id="heart" width="448" height="640"></canvas></article></section></main>
<script src="effects/accents.js"></script>
<script>
const CONFIG=[{"id": "idle", "path": "motion/idle-v2", "row": 0, "cycle": 3.2, "label": "교복 · 란과 이야기", "stateTitle": "기본 대기", "stateNote": "작업 없이 곁에서 쉬는 상태"}, {"id": "drag-right", "path": "motion/drag-right-v1", "row": 1, "cycle": 1.6, "label": "교복 · 란과 오른쪽 이동", "stateTitle": "오른쪽 이동", "stateNote": "레토를 오른쪽으로 끌어 이동할 때"}, {"id": "drag-left", "path": "motion/drag-left-v1", "row": 2, "cycle": 1.6, "label": "교복 · 란과 왼쪽 이동", "stateTitle": "왼쪽 이동", "stateNote": "레토를 왼쪽으로 끌어 이동할 때"}, {"id": "waving", "path": "motion/waving-v1", "row": 3, "cycle": 2.4, "label": "변신 · 란과 하이파이브", "stateTitle": "완료", "stateNote": "작업을 마치고 인사하는 상태"}, {"id": "jumping", "path": "motion/jumping-v1", "row": 4, "cycle": 2.4, "label": "변신 · 함께 응원 점프", "stateTitle": "점프 반응", "stateNote": "짧게 뛰며 응원하는 반응"}, {"id": "failed", "path": "motion/failed-v1", "row": 5, "cycle": 3.2, "label": "교복 · 란의 응원", "stateTitle": "오류·실패", "stateNote": "작업이 실패했을 때"}, {"id": "waiting", "path": "motion/waiting-v1", "row": 6, "cycle": 3.2, "label": "교복 · 란과 완장 확인", "stateTitle": "입력 대기", "stateNote": "입력이나 승인을 기다리는 상태"}, {"id": "running", "path": "motion/running-v1", "row": 7, "cycle": 2.4, "label": "교복 · 함께 하트 언록 준비", "stateTitle": "작업 중", "stateNote": "생각하거나 답변을 만드는 상태"}, {"id": "review", "path": "motion/review-v1", "row": 8, "cycle": 3.2, "label": "교복 · 란과 하트 확인", "stateTitle": "도구 사용 중", "stateNote": "도구를 실행하는 상태"}, {"id": "sleeping", "path": "motion/sleeping-v1", "row": 11, "cycle": 6.4, "label": "교복 · 란과 잠들기", "stateTitle": "수면", "stateNote": "쉬면서 잠든 상태"}],pad=(n,w=2)=>String(n).padStart(w,'0');
const fetchImage=src=>new Promise((res,rej)=>{const im=new Image;im.onload=()=>res(im);im.onerror=()=>rej(new Error(src));im.src=src});
let time=0,last=performance.now(),paused=false,speed=1,showEffects=true,hold=false;
const pending=new Map,fx=new Map;
function effect(path){if(fx.has(path))return fx.get(path);if(!pending.has(path)){pending.set(path,fetchImage(path).then(im=>{fx.set(path,im);pending.delete(path);if(fx.size>200)fx.delete(fx.keys().next().value)}).catch(()=>pending.delete(path)))}return null}
const draw=(ctx,im,x=0,y=0)=>{if(im)ctx.drawImage(im,x,y)};
let interactionPlan,partnerSprites={};
function partnerSample(s,poseTime,effectTime,gazeDirection=null){poseTime=Math.max(0,poseTime);effectTime=Math.max(0,effectTime);const track=interactionPlan.rows[String(s.row)];let side=track.side,pose,x,y;
 if(gazeDirection!==null){side='right';x=315;y=s.row===3?365:350;pose=Math.floor(effectTime/.8)%2}
 else{let phase=hold?0:(poseTime/track.cycle*16)%16;if(Math.abs(phase-Math.round(phase))<1e-7)phase=Math.round(phase)%16;const i=Math.floor(phase),a=track.frames[i],b=track.frames[(i+1)%16];let u=phase-Math.floor(phase);u=u*u*(3-2*u);x=a.x+(b.x-a.x)*u;y=a.y+(b.y-a.y)*u;pose=hold?Math.floor(effectTime/.8)%2:a.pose}
 y+=(side==='sleep'?.4:pose===3?.35:1.1)*Math.sin(effectTime*2*Math.PI/(side==='sleep'?6.4:1.6));return{side,pose,x:Math.floor(x+.5),y:Math.floor(y+.5)}}
function inViewport(ctx){const r=ctx.canvas.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight}
function prefetch(s,t){const n=Math.floor((t%8)*10+1e-7)%80;for(let j=1;j<=6;j++)for(const layer of ['back','front'])effect(`${s.path}/effect_${layer}/${pad((n+j)%80,3)}.png?fx=3`)}
function scene(s,ctx,t,override,gazeDirection=null){ctx.clearRect(0,0,448,640);const f=hold?0:Math.floor((t%s.cycle)/(s.cycle/16)+1e-7)%16;const ef=Math.floor((t%8)*10+1e-7)%80;
 if(showEffects)draw(ctx,effect(`${s.path}/effect_back/${pad(ef,3)}.png?fx=3`));draw(ctx,override||s.cats[f]);
 const p=partnerSample(s,t,t,gazeDirection);draw(ctx,partnerSprites[p.side][p.pose],p.x,p.y);if(showEffects){draw(ctx,effect(`${s.path}/effect_front/${pad(ef,3)}.png?fx=3`));paintAccent(ctx,s,hold?0:t,gazeDirection!==null)}return f}
async function start(){interactionPlan=await fetch('interaction/plan.json').then(r=>r.json());await Promise.all(['left','right','sleep'].map(async side=>{const path=side==='sleep'?'motion/sleeping-v1/companion':`motion/ran-interaction-${side}-v1/character`;partnerSprites[side]=await Promise.all(Array.from({length:8},(_,i)=>fetchImage(`${path}/R${pad(i)}.png`)))}));for(const s of CONFIG){const el=document.createElement('article');el.innerHTML=`<div class="state-label">${s.stateTitle}</div><h2>${s.label}</h2><p class="state-note">${s.stateNote}</p><canvas width="448" height="640"></canvas><small class="phase"></small><p><a href="${s.path}/${s.id}-light.gif?effects=heart3">GIF 보기</a></p>`;document.querySelector('#grid').append(el);s.ctx=el.querySelector('canvas').getContext('2d');s.phase=el.querySelector('.phase')}
 await Promise.all(CONFIG.map(async s=>{s.cats=await Promise.all(Array.from({length:16},(_,i)=>fetchImage(`${s.path}/character/F${pad(i)}.png`)));s.pets=await Promise.all(Array.from({length:8},(_,i)=>fetchImage(`${s.path}/companion/R${pad(i)}.png`)))}));
 const gazes={};for(const costume of ['school','heart'])gazes[costume]=await Promise.all(Array.from({length:16},(_,i)=>fetchImage(`motion/gaze-${costume}-v2/character/G${pad(i)}.png`)));
 await Promise.all(CONFIG.flatMap(s=>[0,1,2].flatMap(n=>['back','front'].map(async layer=>{const path=`${s.path}/effect_${layer}/${pad(n,3)}.png?fx=3`;fx.set(path,await fetchImage(path))}))));
 document.querySelector('#load').textContent='10가지 동작 · 각 16장 · 시선 32방향';
 function tick(now){if(!paused)time+=Math.max(0,(now-last)/1000)*speed;last=now;for(const s of CONFIG){if(!inViewport(s.ctx))continue;prefetch(s,time);const f=scene(s,s.ctx,time);s.phase.textContent=`${s.cycle.toFixed(1)}초 / 컷 ${pad(f)}`}
 const dir=Number(document.querySelector('#direction').value);document.querySelector('#directionName').textContent=`방향 ${dir} / 15`;
 for(const [costume,state] of [['school',CONFIG[0]],['heart',CONFIG[3]]]){const ctx=document.querySelector('#'+costume).getContext('2d');if(inViewport(ctx)){prefetch(state,time);scene(state,ctx,time,gazes[costume][dir],dir)}}document.querySelector('#clock').textContent=`${time.toFixed(2)}초 · ${paused?'정지':'재생 중'}`;requestAnimationFrame(tick)}last=performance.now();requestAnimationFrame(tick)}
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'재생':'일시정지'};document.querySelector('#speed').onchange=e=>speed=Number(e.target.value);document.querySelector('#theme').onclick=e=>{document.body.classList.toggle('dark');e.target.textContent=document.body.classList.contains('dark')?'밝은 배경':'어두운 배경'};
document.querySelector('#effects').onclick=e=>{showEffects=!showEffects;e.target.setAttribute('aria-pressed',showEffects)};document.querySelector('#hold').onclick=e=>{hold=!hold;e.target.setAttribute('aria-pressed',hold)};document.querySelector('#reset').onclick=()=>time=0;start().catch(e=>document.querySelector('#load').textContent='불러오기 실패: '+e.message);
</script>
