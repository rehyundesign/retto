<!doctype html><html lang="ko"><meta charset="utf-8"><title>아무 · 란 — 교복 대기 v2</title>
<style>body{margin:32px;background:#fffdfa;color:#51444d;font:15px system-ui}h1{font-size:20px;font-weight:600}main{display:flex;gap:32px}figure{margin:0}img{width:224px;height:320px;display:block}figcaption{margin:12px 0}button{font:inherit;margin:8px 8px 16px 0;padding:8px 14px;border:1px solid #cbbcc5;border-radius:8px;background:none;color:inherit}body.dark{background:#23232d;color:#f0e7ee}small{display:block;line-height:1.7;margin-top:20px}</style>
<h1>아무 · 란 — 교복 대기 v2</h1><button id="theme">밝은 / 어두운 배경</button><button id="layers">캐릭터만 보기</button><button id="restart">처음부터</button>
<main><figure><img id="current" src="idle-light.gif"><figcaption>새 교복 대기 · 실제 크기</figcaption></figure><figure><img src="reference/current-base-idle.png"><figcaption>원본 레토 · 체형 기준</figcaption></figure><figure><img src="reference/hana-idle-3.2s.gif"><figcaption>하나 · 동작과 재질 참고</figcaption></figure></main>
<small>몸 전체를 그린 넥타이 정리 동작 · 고양이 3.2초 주기<br>원본 얼굴 폭 · 몸 높이 · 지지 앞발 확인<br>앱 적용 전 검토본</small>
<script>let dark=false,bare=false;const image=document.querySelector('#current');function render(){document.body.classList.toggle('dark',dark);image.src=(bare?'character-only-':'idle-')+(dark?'dark':'light')+'.gif?'+Date.now()}document.querySelector('#theme').onclick=()=>{dark=!dark;render()};document.querySelector('#layers').onclick=()=>{bare=!bare;render()};document.querySelector('#restart').onclick=render;</script></html>
