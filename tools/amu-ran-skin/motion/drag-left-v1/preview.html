<!doctype html><html lang="ko"><meta charset="utf-8"><title>아무 · 란 — 왼쪽 이동</title><style>body{margin:32px;background:#fffdfa;color:#51444d;font:14px system-ui}body.dark{background:#23232d;color:#eee}button{padding:10px;margin:8px 4px 16px 0}main{display:flex;gap:24px}figure{margin:0}img{width:224px;height:320px;object-fit:contain}p{font-size:12px;line-height:1.8}</style><h3>아무 · 란 — 왼쪽 이동</h3><button id="theme">밝은 / 어두운 배경</button><button id="layers">캐릭터만 보기</button><button id="restart">처음부터</button><main><figure><img id="current" src="drag-left-light.gif"><figcaption>새 교복 이동 · 실제 크기</figcaption></figure><figure><img id="base" src="reference/original-left.gif"><figcaption>원본 레토 · 자세와 체형 기준</figcaption></figure><figure><img src="reference/hana-left.gif"><figcaption>하나 · 동작과 재질 참고</figcaption></figure></main><p>독립 16컷 · 캐릭터 1.6초 주기 · 효과 8초 주기<br>앱 적용 전 검토본 · 원본 자세별 진단값은 별도 기록</p><script>let dark=false,bare=false;function draw(){document.body.classList.toggle('dark',dark);document.querySelector('#current').src=(bare?'character-only-':'drag-left-')+(dark?'dark':'light')+'.gif?t='+Date.now()}document.querySelector('#theme').onclick=()=>{dark=!dark;draw()};document.querySelector('#layers').onclick=()=>{bare=!bare;draw()};document.querySelector('#restart').onclick=()=>{draw();document.querySelector('#base').src='reference/original-left.gif?t='+Date.now()}</script></html>
