<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>잔느 · 핀 — 분리 이펙트</title><style>
*{box-sizing:border-box}body{margin:0;background:#191820;color:#f6e9e5;font:14px/1.5 system-ui,sans-serif}main{max-width:1050px;margin:40px auto;padding:0 24px}h1{font-size:24px;margin-bottom:8px}p{color:#c8b9bb}.states{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button,select{font:inherit;color:inherit;background:#302730;border:1px solid #65505a;border-radius:8px;padding:8px 12px;cursor:pointer}button.selected{background:#783546;border-color:#d88796}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap}label{display:flex;align-items:center;gap:6px}.preview{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:24px 0}.stage{width:320px;min-height:380px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#23212d}.stage.light{background:#fffbf4}canvas{width:224px;height:320px}.caption{text-align:center;color:#bca5ab}.detail{padding:16px;border:1px solid #50404b;border-radius:10px;font-variant-numeric:tabular-nums}#error{color:#ffb7ae}a{color:#eeb5c2}</style>
<main><h1>잔느 · 핀 — 봉인 · 체크메이트 잔광</h1><p>붉은 새틴 리본 · 흰 깃털 · 금빛 반짝임 · 로사리오 발광</p><nav class="states" id="states"></nav><div class="controls"><button id="play">일시 정지</button><label>속도 <select id="speed"><option value="1">1× 실제 속도</option><option value=".5">0.5×</option><option value="2">2×</option></select></label><label><input id="effects" type="checkbox" checked>이펙트</label><label><input id="freeze" type="checkbox">캐릭터 포즈 고정</label><label><input id="original" type="checkbox">기존 통합 이미지 비교</label></div><div class="preview"><div><div class="stage"><canvas id="dark" width="448" height="640"></canvas></div><div class="caption">224 × 320 · 어두운 배경</div></div><div><div class="stage light"><canvas id="light" width="448" height="640"></canvas></div><div class="caption">224 × 320 · 밝은 배경</div></div></div><div class="detail" id="status"></div><p id="downloads"></p><p id="error"></p></main><script src="preview-data.js"></script><script src="preview.js"></script></html>
