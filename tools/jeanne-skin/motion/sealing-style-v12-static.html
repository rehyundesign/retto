<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>잔느 · 봉인 이펙트 스타일</title><style>body{margin:0;background:#ece9e4;color:#302d32;font:15px/1.65 system-ui,sans-serif}main{max-width:850px;margin:36px auto;padding:24px}h1{font-size:25px}p{color:#635d65}button{padding:8px 14px;border:1px solid #cbbec2;border-radius:8px;background:white;cursor:pointer}.gallery{display:flex;gap:24px;flex-wrap:wrap;margin-top:24px}figure{margin:0}img{display:block;width:224px;height:320px;border-radius:12px}body.large img{width:448px;height:640px}figcaption{margin-top:10px;color:#635d65}</style><main><h1>잔느 · 봉인 이펙트 스타일</h1><p>봉인 정점 한 장의 새 디자인입니다. 로사리오에서 퍼지는 분홍빛·흰 깃털·붉은 실크 리본을 함께 구성했습니다.<br>레토와 핀의 원본 그림을 유지했고, 얼굴 앞의 빛은 뒤쪽으로 배치했습니다. 아직 모션에는 적용하지 않았습니다.</p><button id="size">2× 확대</button><div class="gallery"><figure><img src="sealing-style-v12/dark.png" alt="어두운 배경의 새 봉인 디자인"><figcaption>어두운 배경 · 1×</figcaption></figure><figure><img src="sealing-style-v12/white.png" alt="흰 배경의 새 봉인 디자인"><figcaption>흰 배경 · 1×</figcaption></figure></div></main><script>document.getElementById('size').onclick=function(){const big=document.body.classList.toggle('large');this.textContent=big?'1× 크기':'2× 확대';document.querySelectorAll('figcaption').forEach(el=>el.textContent=el.textContent.replace(/[12]×/,big?'2×':'1×'))};</script></html>
