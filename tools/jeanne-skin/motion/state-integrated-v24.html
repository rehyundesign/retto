<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>잔느 레토 · 상태별 통합 생성 모션</title><style>*{box-sizing:border-box}body{background:#181827;color:#fff6ec;font:14px system-ui;margin:0}body.light{background:#fffdf8;color:#382c32}main{max-width:1140px;margin:auto;padding:24px}p{line-height:1.65;opacity:.8}button{padding:9px 12px;border-radius:8px;border:1px solid #ae879a;color:inherit;background:transparent;cursor:pointer}header{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.hero{display:flex;flex-wrap:wrap;gap:22px;border:1px solid #977a8855;border-radius:16px;padding:18px}.stage{position:relative;width:224px;height:320px;flex-shrink:0}.hero .stage{width:448px;height:640px}.small .hero .stage{width:224px;height:320px}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.details{flex:1;min-width:240px}.frames{display:flex;flex-wrap:wrap;gap:5px;margin:16px 0}.frames button{font-size:12px;min-width:32px;padding:7px}.active{background:#8d3452;color:white}a{color:#d5a666}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}.card{border:1px solid #95748866;border-radius:14px;padding:14px;cursor:pointer}.card .stage{margin:auto}.card.selected{border-color:#e2b379}.card p{font-size:12px}.badge{display:inline-block;font-size:12px;border:1px solid #a8847255;border-radius:6px;padding:6px}.error{color:#ff8fa5}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero .stage{width:280px;height:400px}main{padding:14px}}</style><main><h1>잔느 레토 · 보행과 인사 수정</h1><p>좌우 이동은 선택하신 원본 8개 보행 자세, 완료 인사는 같은 앞발의 올림·내림을 다시 생성했습니다. 점프는 승인한 동작을 참고하면서 주변 이펙트를 줄였습니다.</p><header><button id="pause">일시정지</button><button id="theme">흰 배경</button><button id="size">1× 크기</button><button id="restart">처음부터</button><label><input id="hold" type="checkbox">프레임 고정</label></header><p id="error" class="error"></p><section class="hero"><div class="stage" id="hero"></div><div class="details"><h2 id="title">불러오는 중</h2><p id="status" class="badge"></p><p id="note"></p><p id="current"></p><div class="frames" id="frames"></div><p id="downloads"></p><p>이미지에 이펙트가 포함되어 있어 프레임을 고정하면 이펙트도 함께 멈춥니다.</p></div></section><div id="states" class="grid"></div><p id="coverage"></p><p>앱 적용 전 시각 검토용 후보입니다. 그림 개수·타이밍 검사와 별도로 실제 앱 동작 확인이 필요합니다.</p></main><script src="state-integrated-v24-data.js?v=1791960872360"></script><script>
'use strict';document.body.classList.add('small');document.getElementById('size').textContent='큰 크기';const REV=Date.now().toString(36);const $=id=>document.getElementById(id),rows=window.JeanneIntegrated19,cards=[],allImages=[];let active=0,time=0,last=performance.now(),paused=false,ready=false,fixed=0,selectedAt=0;
function frameAt(r,t){let q=((t%r.cycle)+r.cycle)%r.cycle;if(r.times){for(let i=0;i<r.times.length;i++){if(q<r.times[i])return i;q-=r.times[i]}return r.files.length-1}return Math.floor(q/r.cycle*r.files.length)%r.files.length}
function set(stage,r,f){const img=stage.querySelector('img');if(img.dataset.src!==r.files[f]){img.src=r.files[f]+'?rev='+REV;img.dataset.src=r.files[f]}}
function select(i){active=i;selectedAt=time;fixed=0;$('hold').checked=false;const r=rows[i];$('frames').replaceChildren();for(let f=0;f<r.files.length;f++){const b=document.createElement('button');b.textContent=f+1;b.onclick=()=>{fixed=f;$('hold').checked=true;paint()};$('frames').append(b)}$('downloads').replaceChildren();for(const a of r.animations){const link=document.createElement('a');link.href=a.file+'?rev='+REV;link.textContent='모션 이미지 · '+(a.theme==='dark'?'어두운 배경':'흰 배경');link.target='_blank';link.style.marginRight='12px';$('downloads').append(link)}cards.forEach((c,k)=>c.classList.toggle('selected',k===i));paint()}
function paint(){if(!ready)return;const r=rows[active];if(!$('hold').checked)fixed=frameAt(r,time-selectedAt);set($('hero'),r,fixed);$('title').textContent=r.label;$('status').textContent=r.status;$('note').textContent=r.note;$('current').textContent=`${fixed+1} / ${r.files.length} · 한 주기 ${r.cycle}초`;[...$('frames').children].forEach((b,i)=>b.classList.toggle('active',i===fixed));cards.forEach((c,i)=>set(c.querySelector('.stage'),rows[i],frameAt(rows[i],time)))}
const heroImg=new Image();heroImg.alt='잔느 레토와 핀';$('hero').append(heroImg);rows.forEach((r,i)=>{const card=document.createElement('section');card.className='card';const stage=document.createElement('div');stage.className='stage';const img=new Image();img.alt=r.label;stage.append(img);card.append(stage);const h=document.createElement('h3');h.textContent=r.label;card.append(h);const p=document.createElement('p');p.textContent=`통합 생성 ${r.files.length}장 · ${r.cycle}초`;card.append(p);card.onclick=()=>select(i);$('states').append(card);cards.push(card)});$('coverage').textContent=`${rows.length} / 10개 상태 준비 · 이번 수정 4개 상태 · 좌우 보행은 각각 8개 원본 자세`;
Promise.all(rows.flatMap(r=>r.files).map(src=>new Promise((resolve,reject)=>{const img=new Image();allImages.push(img);img.onload=resolve;img.onerror=()=>reject(Error('이미지 로딩 실패: '+src));img.src=src+'?rev='+REV}))).then(()=>{ready=true;select(Math.max(0,rows.findIndex(r=>r.id==='drag-right')))}).catch(e=>$('error').textContent=e.message);
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'재생':'일시정지'};$('theme').onclick=()=>{document.body.classList.toggle('light');$('theme').textContent=document.body.classList.contains('light')?'어두운 배경':'흰 배경'};$('size').onclick=()=>{document.body.classList.toggle('small');$('size').textContent=document.body.classList.contains('small')?'큰 크기':'1× 크기'};$('restart').onclick=()=>{selectedAt=time;fixed=0;paint()};$('hold').onchange=paint;function tick(now){if(ready&&!paused)time+=(now-last)/1000;last=now;if(ready&&!paused)paint();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
