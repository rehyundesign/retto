<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>잔느 레토 · 기본 대기 모션</title>
<style>body{background:#171827;color:#fff5e8;font:16px system-ui;margin:0;padding:24px}body.light{background:#faf8f3;color:#332830}main{max-width:980px;margin:auto}button{font:inherit;background:transparent;color:inherit;border:1px solid #9b8490;border-radius:8px;padding:8px;margin:4px}#stage{width:448px;height:640px;position:relative;max-width:90vw;margin:20px auto}#stage.small{width:224px;height:320px}.layer{position:absolute;width:100%;height:100%;inset:0}svg{width:100%;height:100%}img{object-fit:contain}p{line-height:1.6}#frames{display:flex;flex-wrap:wrap}button.active{background:#9c2943}#status{font-size:14px}.comparison{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}figure{margin:18px 0}figcaption{font-size:14px;margin-bottom:10px}.hana-window{position:relative;width:224px;height:320px;overflow:hidden}.hana-window img{position:absolute;max-width:none;left:-18px;top:-90px}#stage{margin:0} </style>
<main><h1>잔느 레토 · 기본 대기</h1><p>눈 깜빡임 · 작은 호흡 · 꼬리와 핀의 날갯짓<br>의상·포즈·핀을 함께 그린 독립 프레임 · 귀와 꼬리 움직임 보정본 · 나머지 상태는 제작 중입니다.</p><button id="pause">일시정지</button><button id="theme">흰 배경</button><button id="size">2× 보기</button><label><input type="checkbox" id="effects" checked>이펙트</label><label><input type="checkbox" id="hold">자세 고정</label><div class="comparison"><figure><figcaption>원본 레토 · 1×</figcaption><img width="224" height="320" src="../../jeanne-base-reference.png" alt="원본 레토"></figure><figure><figcaption>잔느 수정본</figcaption><div id="stage" class="small"><div class="layer" id="back"></div><img class="layer" id="cat" alt="잔느 레토와 핀"><div class="layer" id="front"></div></div></figure><figure><figcaption>하나토토 · 1× 비교 참고</figcaption><div class="hana-window"><img src="hana-quality-reference.webp" width="1230" height="810" alt="하나토토 기준 애니메이션"></div></figure></div><p id="status">이미지 불러오는 중</p><div id="frames"></div></main>
<script src="idle-effects-v3.js"></script><script>
const $=id=>document.getElementById(id),images=[];let elapsed=0,last=performance.now(),paused=false,frame=0,loaded=false;
for(let i=0;i<16;i++){let b=document.createElement('button');b.textContent=i+1;b.onclick=()=>{frame=i;$('hold').checked=true;paint()};$('frames').append(b)}
function paint(){if(!loaded)return;if(!$('hold').checked)frame=Math.floor(elapsed/.2)%16;if($('cat').dataset.frame!==String(frame)){$('cat').src=images[frame].src;$('cat').dataset.frame=String(frame)}const e=JeanneEffects.render('idle',elapsed,frame);$('back').innerHTML=$('effects').checked?e.back:'';$('front').innerHTML=$('effects').checked?e.front:'';$('status').textContent=`${frame+1} / 16 · 한 주기 3.2초 · 앱 적용 전 검토본`;[...$('frames').children].forEach((b,i)=>b.classList.toggle('active',i===frame))}
Promise.all(Array.from({length:16},(_,i)=>new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{images[i]=im;resolve()};im.onerror=()=>reject(Error('프레임 '+(i+1)+' 로딩 실패'));im.src='idle-direct-v4/idle-'+String(i).padStart(2,'0')+([1,2].includes(i)?'-refined':'')+'.png'}))).then(()=>{loaded=true;paint()}).catch(e=>$('status').textContent=e.message);
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'재생':'일시정지'};$('theme').onclick=()=>document.body.classList.toggle('light');$('size').onclick=()=>{$('stage').classList.toggle('small');$('size').textContent=$('stage').classList.contains('small')?'2× 보기':'1× 보기'};$('effects').onchange=paint;
function tick(now){if(!paused)elapsed+=(now-last)/1000;last=now;paint();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
