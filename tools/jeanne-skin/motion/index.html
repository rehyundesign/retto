<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>잔느 레토 · 모션 미리보기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171827;color:#f6eff0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}body.light{background:#faf8f3;color:#3b3034}main{max-width:1400px;padding:28px;margin:auto}h1{font-size:24px;margin:0 0 10px}p{line-height:1.6;opacity:.72}button,select{background:transparent;color:inherit;border:1px solid #88757e;padding:9px 12px;border-radius:9px;font:inherit;cursor:pointer}button.active{background:#8e243e;color:white}header,.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{position:sticky;top:0;background:inherit;padding:16px 0;z-index:3}label{display:flex;align-items:center;gap:7px}.hero{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;border:1px solid #87768155;padding:24px;border-radius:18px;margin-top:12px}.stage{position:relative;width:224px;height:320px;overflow:hidden;flex-shrink:0}.stage.big{width:448px;height:640px}.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.layer svg{width:100%;height:100%;display:block}.character{object-fit:contain}.controls{min-width:250px;flex:1}.frames{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0}.frames button{font-size:12px;padding:7px;min-width:32px}.sub{font-size:12px;opacity:.65;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;margin-top:30px}.tile{border:1px solid #88778155;border-radius:14px;padding:20px;cursor:pointer}.tile.selected{border-color:#edb46a}.tile .stage{margin:auto;width:336px;height:480px}.tile h3{font-size:16px;margin:12px 0 0}.note{font-size:12px;line-height:1.7;margin-top:26px;opacity:.7}@media(max-width:760px){.grid{grid-template-columns:1fr}.stage.big{width:336px;height:480px}main{padding:15px}}
</style>
<main><h1>잔느 레토 · 모션 미리보기</h1><p>레토의 동작과 핀의 반응 · 짧은 붉은 리본과 금빛 봉인 이펙트</p>
<header><button id="pause">일시정지</button><button id="theme">흰 배경</button><label>속도 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>기준 속도</option><option value="1.5">1.5×</option></select></label><button id="size">1× 크기</button><label><input id="effects" type="checkbox" checked>이펙트 표시</label></header>
<section class="hero"><div class="stage big" id="hero"><div class="layer back"></div><img class="layer character" alt="잔느 의상의 레토와 핀"><div class="layer front"></div></div><div class="controls"><h2 id="title">이미지 불러오는 중</h2><p id="action"></p><div class="tools"><label><input id="hold" type="checkbox">자세 고정 · 이펙트 계속</label><button id="restart">처음부터</button><label><input id="autoReturn" type="checkbox">완료·점프 후 대기로</label></div><div class="frames" id="frames"></div><div class="sub" id="current"></div><p class="sub">프레임 번호를 누르면 자세만 고정됩니다. 이펙트 표시를 끄면 캐릭터 동작을 확인할 수 있습니다.</p></div></section>
<section class="grid" id="grid"></section><p class="note">상태별 16개의 독립 캐릭터 이미지 · 앱 적용 전 모션 미리보기<br>원본 레토의 크기·위치 검증과 실제 앱 적용은 별도 확인이 필요합니다.</p></main>
<script src="effects.js"></script><script>
'use strict';
const descriptions={idle:'숨을 쉬고 핀을 바라보며 눈을 깜빡입니다.',running:'로사리오에 앞발을 가져갔다가 봉인 동작으로 펼칩니다.',review:'앞발을 들어 봉인할 표적을 확인하고 겨눕니다.',waiting:'로사리오를 두드리고 핀에게 기다리는 신호를 보냅니다.',failed:'놀라 몸을 낮췄다가 핀을 달래며 자세를 회복합니다.',waving:'앞발을 흔들고 낮춘 뒤 고개를 숙여 인사합니다.',jumping:'몸을 낮추고 도약한 뒤 착지와 회복을 이어갑니다.',sleeping:'누운 자세에서 호흡과 귀·꼬리의 작은 움직임을 이어갑니다.','drag-right':'네 발을 번갈아 움직여 오른쪽으로 달립니다.','drag-left':'반대 방향의 보행과 의상 움직임을 보여줍니다.'};
const $=id=>document.getElementById(id),hero=$('hero');let states=[],active=0,time=0,stateStart=0,last=performance.now(),paintAt=0,paused=false,speed=1,fixed=0,tiles=[];
const ready=new Map();
async function preload(files){await Promise.all(files.map(src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{ready.set(src,im);resolve()};im.onerror=()=>reject(new Error('이미지를 읽지 못했습니다: '+src));im.src=src})));}
function frameAt(s,t){return Math.floor(Math.max(0,t)/s.cycle*16)%16;}
function draw(stage,s,f,t){const src=s.files[f],im=stage.querySelector('img');if(im.dataset.source!==src){im.src=src;im.dataset.source=src}const layers=JeanneEffects.render(s.id,t,f);stage.querySelector('.back').innerHTML=layers.back;stage.querySelector('.front').innerHTML=layers.front;stage.querySelector('.back').style.display=stage.querySelector('.front').style.display=$('effects').checked?'block':'none';}
function select(i){active=i;stateStart=time;fixed=0;$('hold').checked=false;$('title').textContent=states[i].label;$('action').textContent=descriptions[states[i].id];tiles.forEach((el,j)=>el.classList.toggle('selected',i===j));paint();}
function paint(){if(!states.length)return;let s=states[active],t=time-stateStart;const returnCycles=s.id==='waving'?2:1;if($('autoReturn').checked&&!$('hold').checked&&['waving','jumping'].includes(s.id)&&t>=s.cycle*returnCycles){select(0);return;}const f=$('hold').checked?fixed:frameAt(s,t);fixed=f;draw(hero,s,f,t);tiles.forEach((el,i)=>draw(el.querySelector('.stage'),states[i],frameAt(states[i],time),time));[...$('frames').children].forEach((b,i)=>b.classList.toggle('active',i===f));$('current').textContent=`${f+1} / 16 · 독립 자세 16개 · 한 주기 ${(s.cycle/speed).toFixed(2)}초`;}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'재생':'일시정지'};$('theme').onclick=()=>{const light=document.body.classList.toggle('light');$('theme').textContent=light?'어두운 배경':'흰 배경'};$('speed').onchange=e=>{speed=Number(e.target.value)};$('size').onclick=()=>{hero.classList.toggle('big');$('size').textContent=hero.classList.contains('big')?'1× 크기':'2× 크기'};$('restart').onclick=()=>{stateStart=time;fixed=0;$('hold').checked=false;paint()};$('effects').onchange=paint;
function tick(now){const dt=Math.max(0,(now-last)/1000);last=now;if(!paused)time+=dt*speed;if(now-paintAt>=1000/60){paint();paintAt=now}requestAnimationFrame(tick)}
fetch('manifest.json').then(r=>{if(!r.ok)throw new Error('모션 목록을 읽지 못했습니다');return r.json()}).then(async data=>{states=data.states;await preload(states.flatMap(s=>s.files));states.forEach((s,i)=>{const el=document.createElement('article');el.className='tile';el.innerHTML=`<div class="stage"><div class="layer back"></div><img class="layer character" alt="${s.label}"><div class="layer front"></div></div><h3>${s.label}</h3><div class="sub">16개 독립 자세 · ${s.cycle}초</div>`;el.onclick=()=>select(i);$('grid').appendChild(el);tiles.push(el)});for(let f=0;f<16;f++){const b=document.createElement('button');b.textContent=f+1;b.onclick=()=>{fixed=f;$('hold').checked=true;paint()};$('frames').appendChild(b)}select(0);last=performance.now();requestAnimationFrame(tick);window.JeannePreview={states,select,frameAt,paint,getTime:()=>time,freeze:f=>{fixed=f;$('hold').checked=true;paint()}};}).catch(error=>{$('title').textContent=error.message;console.error(error)});
</script></html>
