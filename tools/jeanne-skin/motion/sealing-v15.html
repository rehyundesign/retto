<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>잔느 레토 · 상태별 모션 이미지</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171827;color:#fff6ec;font:14px -apple-system,BlinkMacSystemFont,sans-serif}body.light{background:#faf8f3;color:#382c32}main{max-width:1200px;margin:auto;padding:26px}h1{font-size:25px}p{line-height:1.65}.intro{opacity:.8;max-width:880px}button{font:inherit;color:inherit;background:transparent;border:1px solid #947a87;border-radius:9px;padding:8px 12px;cursor:pointer}a{color:#d5a666;margin-right:14px}button.active{background:#902945;color:white}header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:16px 0;position:sticky;top:0;background:inherit;z-index:5}label{display:flex;gap:6px;align-items:center}.hero{display:flex;gap:30px;flex-wrap:wrap;border:1px solid #92758055;border-radius:18px;padding:20px}.stage{position:relative;width:336px;height:480px;flex-shrink:0;overflow:hidden}.hero .stage{width:448px;height:640px}.small .stage,.small .hero .stage{width:224px;height:320px}.layer{position:absolute;width:100%;height:100%;inset:0;pointer-events:none}.layer svg{display:block;width:100%;height:100%}.character{object-fit:contain}.details{flex:1;min-width:250px}.badge{font-size:12px;display:inline-block;border:1px solid #c49d7055;color:#e9bd86;padding:6px 9px;border-radius:7px}.light .badge{color:#94532d}.note{opacity:.7;line-height:1.65}.frames{display:flex;gap:5px;flex-wrap:wrap;margin:18px 0}.frames button{font-size:12px;padding:7px;min-width:32px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{border:1px solid #96798655;border-radius:14px;padding:18px;cursor:pointer}.card.selected{border-color:#e5b272}.card .stage{margin:auto}.card h3{margin:14px 0 8px}.card .note{font-size:12px;margin-bottom:0}.heading{margin:32px 0 16px;font-size:19px}.current{font-size:13px;opacity:.75}#loadError{color:#ffabbc} @media(max-width:850px){.grid{grid-template-columns:1fr}.hero .stage{width:336px;height:480px}main{padding:16px}.hero{padding:16px}}
</style>
<main><h1>잔느 레토 · 봉인 · 분홍빛 리본 모션</h1><p class="intro">봉인 빛과 리본을 조금 더 셀 애니메이션 같은 색감으로 정리했습니다. 주요 이펙트 변화는 레토의 16개 포즈와 같은 간격으로 맞추고, 반짝임과 발광은 차분하게 줄였습니다.</p>
<header><button id="pause">일시정지</button><button id="theme">흰 배경</button><button id="size">1× 크기</button><label><input id="effects" type="checkbox" checked>이펙트 표시</label><label><input id="hold" type="checkbox">자세 고정 · 이펙트 계속</label><label><input id="trials" type="checkbox">미완성 시험 4장 보기</label></header>
<p id="loadError"></p><section class="hero"><div class="stage" id="hero"><div class="layer back"></div><img class="layer character" alt="잔느 레토와 핀"><div class="layer front"></div></div><div class="details"><h2 id="title">이미지 불러오는 중</h2><div id="status" class="badge"></div><p id="note" class="note"></p><p id="current" class="current"></p><div id="frames" class="frames"></div><p id="downloads"></p><p class="note">프레임 번호를 누르면 해당 자세를 고정합니다. 팬던트 빛과 이펙트는 계속 움직입니다.</p></div></section>
<h2 class="heading">8개 상태와 양방향 이동</h2><div id="states" class="grid"></div><p class="note">앱 적용 전 미리보기입니다. 원본 레토의 정확한 크기·위치와 전체 상태의 최종 모션 검증은 아직 남아 있습니다.</p></main>
<script src="effects.js"></script><script>window.JeanneStateBase=window.JeanneEffects;</script><script src="idle-effects-v3.js"></script><script>window.JeanneIdleBase=window.JeanneEffects;</script><script src="effects-checkmate-v6-locked.js"></script><script src="jeanne-effects-hana-v8.js"></script><script src="checkmate-pendant-v9.js"></script><script src="effects-scope-v9-locked.js"></script><script src="effect-art-v10.js"></script><script src="effects-other-states-v10-locked.js"></script><script src="sealing-directed-v11.js"></script><script src="effects-other-states-v11-locked.js"></script><script src="sealing-art-v13.js"></script><script src="sealing-painted-v13.js"></script><script src="effects-other-states-v13-locked.js"></script><script src="sealing-anchors-v14.js"></script><script src="sealing-bound-art-v14.js"></script><script src="sealing-bound-v14.js"></script><script src="effects-other-states-v14-locked.js"></script><script src="sealing-cel-v15.js"></script><script src="effects-other-states-v15-locked.js"></script><script src="sealing-bound-art-v16.js"></script><script src="sealing-costume-v16.js"></script><script src="effects-other-states-v16-locked.js"></script><script src="sealing-balanced-art-v17.js"></script><script src="sealing-balanced-v17.js"></script><script src="latest-effects.js?v=17"></script><script src="latest-motion-data.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),rows=window.JeanneLatestData.filter(r=>r.kind==='state'),cards=[];let active=0,time=0,last=performance.now(),lastPaint=0,paused=false,ready=false,fixed=0,selectedAt=0;
function variant(r){return $('trials').checked&&r.trials.length?{files:r.trials,anchors:r.trialAnchors,times:null,status:'시험 4장 · 중간 동작 보완 필요'}:{files:r.files,anchors:r.anchors,times:r.times,status:r.status}}
function frameAt(r,v,t){if(v.files.length===1)return 0;const cycle=v.times?v.times.reduce((a,b)=>a+b,0):r.cycle;let q=((t%cycle)+cycle)%cycle;if(v.times){for(let i=0;i<v.times.length;i++){if(q<v.times[i])return i;q-=v.times[i]}return v.files.length-1}return Math.floor(q/cycle*v.files.length)%v.files.length}
function draw(stage,r,v,f,t,effectsTick=true){const img=stage.querySelector('img'),src=v.files[f],changed=img.dataset.source!==src;if(changed){img.src=src;img.dataset.source=src}if(!effectsTick&&!changed)return;const e=JeanneLatestEffects.render(r.state,t,f,v.anchors?.[f],$('hold').checked&&stage.id==='hero'?f/16:(((t-(stage.id==='hero'?selectedAt:0))%r.cycle)+r.cycle)%r.cycle/r.cycle);for(const layer of ['back','front']){const target=stage.querySelector('.'+layer);target.innerHTML=$('effects').checked?e[layer]:''}}
function buildFrames(){const r=rows[active];$('downloads').replaceChildren();for(const item of r.animations||[]){const a=document.createElement('a');a.href=item.file;a.textContent='모션 이미지 · '+(item.theme==='dark'?'어두운 배경':'흰 배경');a.target='_blank';$('downloads').append(a);}const v=variant(rows[active]);$('frames').replaceChildren();for(let i=0;i<v.files.length;i++){const b=document.createElement('button');b.textContent=i+1;b.onclick=()=>{fixed=i;$('hold').checked=true;paint()};$('frames').append(b)}}
function select(i){active=i;fixed=0;selectedAt=time;$('hold').checked=false;buildFrames();cards.forEach((el,j)=>el.classList.toggle('selected',i===j));paint()}
function paint(effectsTick=true){if(!ready)return;const r=rows[active],v=variant(r);fixed=$('hold').checked?Math.min(fixed,v.files.length-1):frameAt(r,v,time-selectedAt);draw($('hero'),r,v,fixed,time,effectsTick);$('title').textContent=r.label;$('status').textContent=v.status;$('note').textContent=r.note;$('current').textContent=`${fixed+1} / ${v.files.length} · ${v.files.length===1?'캐릭터 정지 · 이펙트 재생':v.times?'한 주기 3.2초 · 깜빡임 구간 0.41초':`한 주기 ${r.cycle}초 · 캐릭터 모션 검수용`}`;[...$('frames').children].forEach((b,i)=>b.classList.toggle('active',i===fixed));cards.forEach((el,i)=>{const row=rows[i],cv=variant(row);draw(el.querySelector('.stage'),row,cv,frameAt(row,cv,time),time,effectsTick);el.querySelector('.badge').textContent=cv.status})}
rows.forEach((r,i)=>{const el=document.createElement('section');el.className='card';el.innerHTML='<div class="stage"><div class="layer back"></div><img class="layer character" alt="'+r.label+'"><div class="layer front"></div></div><h3>'+r.label+'</h3><div class="badge"></div><p class="note">'+r.note+'</p>';el.onclick=()=>select(i);$('states').append(el);cards.push(el)});
Promise.all([...new Set([...rows.flatMap(r=>[...r.files,...r.trials]),...Object.values(window.SealingBalancedArt17).flat()])].map(src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=()=>reject(Error('이미지를 읽지 못했습니다: '+src));im.src=src}))).then(()=>{ready=true;select(rows.findIndex(r=>r.id==='running'))}).catch(e=>$('loadError').textContent=e.message);
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'재생':'일시정지'};$('theme').onclick=()=>{document.body.classList.toggle('light');$('theme').textContent=document.body.classList.contains('light')?'어두운 배경':'흰 배경'};$('size').onclick=()=>{document.body.classList.toggle('small');$('size').textContent=document.body.classList.contains('small')?'큰 크기':'1× 크기'};$('trials').onchange=()=>select(active);$('effects').onchange=paint;
function tick(now){if(!paused)time+=(now-last)/1000;last=now;const effectsTick=now-lastPaint>=50;if(effectsTick)lastPaint=now;if(!paused)paint(effectsTick);requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
